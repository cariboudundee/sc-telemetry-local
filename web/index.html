<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SC Telemetry Local</title>
<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{font-size:16px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#status{color:var(--dim);font-size:13px}.sp{flex:1}
button.lang{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 10px;cursor:pointer}
main{display:grid;gap:12px;align-items:start;padding:12px 16px 24px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));max-width:1500px;margin:0 auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
section h2{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
section h2 b{color:var(--text);letter-spacing:.04em;text-transform:none;font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:22px;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere;line-height:1.3;height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--dim);height:24px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sh{grid-row:span 2;height:54px;display:flex;align-items:center;justify-content:space-between;gap:6px;line-height:18px}.chip.sh .l{overflow:hidden;text-overflow:ellipsis}.chip.sh .l b{font-weight:400}.chip.sh .l b.on{color:var(--ok)}.chip.sh .l b.off{color:var(--bad)}.chip.sh .st{font-weight:600;flex:none}
.chip.on{color:var(--ok);border-color:#1f5a3a}.chip.off{color:var(--bad);border-color:#5a1f1f}.chip.mid{color:var(--warn);border-color:#5a441f}
.ann{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.ann div{text-align:center;padding:6px 0;border-radius:6px;font-size:12px;font-weight:700;background:#0a1016;color:var(--off);border:1px solid var(--line)}
.ann .nom{color:#5fb98a}.ann .minor{color:#000;background:var(--warn)}.ann .major{color:#fff;background:var(--bad)}.ann .blink{animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--dim)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.num{background:#0a1016;border:1px solid var(--line);border-radius:8px;padding:8px}.num span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.num b{font-size:20px;font-variant-numeric:tabular-nums;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{margin:7px 0}.bar label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}.bar label b{color:var(--text);font-variant-numeric:tabular-nums}
.bar i{display:block;height:7px;background:#0a1016;border-radius:4px;overflow:hidden;margin-top:3px;border:1px solid var(--line)}.bar i u{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.bar.low i u{background:var(--warn)}.bar.crit i u{background:var(--bad)}
.empty{color:var(--dim);font-style:italic;padding:14px 0}
ul.notes{list-style:none;padding:0;margin:8px 0 0;font-size:13px;color:var(--dim)}ul.notes li{padding:3px 0;border-top:1px solid var(--line);height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#setup{grid-column:1/-1;border-color:#2b4a63}#setup.done{padding:8px 14px}#setup.done .steps,#setup.done .act{display:none}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.steps span{font-size:13px;color:var(--dim)}.steps .ok{color:var(--ok)}.steps .cur{color:var(--acc);font-weight:700}
.act{background:#0a1016;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px}.act p{margin:0 0 6px}
.act button{background:var(--acc);color:#001018;border:0;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}.act code{color:var(--acc)}
#phone,#vkbp{display:none;position:fixed;top:52px;right:16px;z-index:3;width:300px;background:var(--panel);border:1px solid #2b4a63;border-radius:10px;padding:14px;box-shadow:0 8px 30px #000a}
#phone.open,#vkbp.open{display:block}#vkbp p{margin:0 0 8px;font-size:13px;color:var(--dim)}#phone p{margin:0 0 8px;font-size:13px;color:var(--dim)}#phone img{display:block;margin:10px auto;background:#fff;padding:6px;border-radius:6px}
#phone .url{text-align:center;font-weight:700;color:var(--acc);word-break:break-all}.sw{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}.sw input{width:18px;height:18px}
footer{color:var(--dim);font-size:12px;text-align:center;padding:0 16px 20px}
@media (max-width:420px){main{padding:10px}header h1{font-size:14px}}
