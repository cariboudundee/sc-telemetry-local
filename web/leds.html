<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED VKB · SC Telemetry Local</title>
<style>
:root{--bg:#070b10;--panel:#0d141c;--line:#1b2a38;--text:#d6e3ee;--dim:#6f8597;--acc:#3ec7ff;--ok:#3ddc84;--warn:#ffb020;--bad:#ff4d4d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{font-size:16px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
a{color:var(--acc)}.sp{flex:1}#msg{color:var(--dim);font-size:13px}
button{background:#132130;border:1px solid #2b4a63;color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
button.pri{background:#0f3a55;border-color:var(--acc)}button.del{border-color:#5a1f1f;color:#ff9a9a}button:disabled{opacity:.5}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--dim);font-size:13px}
.note b{color:var(--text)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.lh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
input,select{background:#0a1118;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:3px 6px;font:inherit}
input.n{width:60px}input.dev{width:150px}input.lab{width:200px}input.arg{width:260px}input.val{width:110px}
input[type=color]{width:38px;height:26px;padding:1px}
table{width:100%;border-collapse:collapse}td,th{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top;text-align:left}
th{color:var(--dim);font-weight:400;font-size:12px}
tr.act td{background:#10301f}tr.act td:first-child{box-shadow:inset 3px 0 var(--ok)}tr.dis td{opacity:.45}
.cond{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:3px}.cur{color:var(--dim);font-size:12px}
.always{color:var(--dim);font-style:italic}
.sw{display:flex;align-items:center;gap:8px}
</style></head><body>
<header><h1 id="t_title"></h1><a href="/" id="t_back"></a><span class="sp"></span><span id="msg"></span>
<button id="reset"></button><button class="pri" id="save" disabled></button><button id="lang">EN</button></header>
<main id="main"></main>
<datalist id="args"></datalist>
<script>
const T={fr:{title:"LED VKB",back:"← Tableau de bord",save:"Enregistrer",reset:"Réglage d'origine",saved:"Enregistré.",unsaved:"Modifications non enregistrées",
sw:"Témoins sur les LED VKB activés",help:"Pour chaque LED, les règles sont lues de haut en bas : la <b>première règle vraie</b> donne la couleur et le mode (ligne en vert). Aucune règle vraie : LED éteinte. Une LED sans règle garde sa fonction d'origine. Les noms sont ceux de la télémétrie du jeu ; « seated » vaut 1 quand tu es assis dans un vaisseau. Valeur : un nombre (oui/non = 1/0) ou le nom d'un état (DEPLOYED, MAJOR, NAVIGATION…). Débrancher/rebrancher l'appareil rend ses LED d'origine.",
devs:"Appareils VKB branchés : ",none:"aucun",device:"Appareil (partie du nom)",led:"LED n°",label:"Nom",ident:"Identifier",delLed:"Supprimer la LED",addRule:"+ Règle",addLed:"+ Ajouter une LED",
conds:"Conditions (toutes vraies)",mode:"Mode",color:"Couleur",on:"Active",always:"toujours",addCond:"+ condition",
modes:{off:"éteinte",on:"fixe",slow:"clignote lent",fast:"clignote rapide",ultra:"très rapide"},
confirmReset:"Remplacer tes règles par le réglage d'origine ?",identOff:"Active d'abord les témoins (case en haut).",now:"maintenant : ",absent:"absent"},
en:{title:"VKB LEDs",back:"← Dashboard",save:"Save",reset:"Defaults",saved:"Saved.",unsaved:"Unsaved changes",
sw:"Indicators on VKB LEDs enabled",help:"For each LED the rules are read top to bottom: the <b>first true rule</b> sets color and mode (green row). No true rule: LED off. An LED with no rules keeps its original function. Names are the game telemetry names; \"seated\" is 1 when you sit in a ship. Value: a number (yes/no = 1/0) or a state name (DEPLOYED, MAJOR, NAVIGATION…). Unplug/replug the device to get its original LEDs back.",
devs:"VKB devices plugged in: ",none:"none",device:"Device (part of name)",led:"LED #",label:"Name",ident:"Identify",delLed:"Remove LED",addRule:"+ Rule",addLed:"+ Add an LED",
conds:"Conditions (all true)",mode:"Mode",color:"Color",on:"On",always:"always",addCond:"+ condition",
modes:{off:"off",on:"solid",slow:"slow blink",fast:"fast blink",ultra:"very fast"},
confirmReset:"Replace your rules with the defaults?",identOff:"Enable the indicators first (checkbox at the top).",now:"now: ",absent:"missing"}};
let L="fr";try{L=localStorage.getItem("sctl-lang")||(navigator.language.startsWith("fr")?"fr":"en")}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LEDS=null,VALS={},NAMES={},DEVS=[],ON=false,dirty=false;
const short=n=>String(n||"").replace(/^[A-Z0-9_]*?_(STATE|MODE|ROLE|TYPE)_/,"");
function match(c){const x=VALS[c.arg];if(x===undefined)return false;const w=String(c.value||"").trim();const f=parseFloat(w);
 if(w!==""&&!isNaN(f)&&/^-?[\d.]+$/.test(w)){const v=Number(x);switch(c.op){case"!=":return v!=f;case">":return v>f;case"<":return v<f;case">=":return v>=f;case"<=":return v<=f}return v==f}
 const N=String(NAMES[c.arg]||x).toUpperCase(),W=w.toUpperCase(),eq=N===W||N.endsWith("_"+W);return c.op==="!="?!eq:eq}
function active(l){for(let i=0;i<l.rules.length;i++){const r=l.rules[i];if(r.disabled)continue;if((r.conds||[]).every(match))return i}return -1}
function cur(a){if(VALS[a]===undefined)return T[L].absent;return VALS[a]+(NAMES[a]?" ("+short(NAMES[a])+")":"")}
function setDirty(d){dirty=d;$("save").disabled=!d;$("msg").textContent=d?T[L].unsaved:""}
function render(){const t=T[L];document.documentElement.lang=L;$("t_title").textContent=t.title;$("t_back").textContent=t.back;$("save").textContent=t.save;$("reset").textContent=t.reset;$("lang").textContent=L==="fr"?"EN":"FR";
 if(!LEDS)return;let h=`<div class="note"><label class="sw"><input type="checkbox" id="sw" ${ON?"checked":""}><b>${esc(t.sw)}</b></label><p>${t.help}</p><p>${esc(t.devs)}${esc(DEVS.length?DEVS.join(" · "):t.none)}</p></div>`;
 LEDS.forEach((l,li)=>{const a=active(l);h+=`<section><div class="lh">${esc(t.device)} <input class="dev" data-l="${li}" data-f="device" value="${esc(l.device)}" list="devlist">
 ${esc(t.led)} <input class="n" type="number" min="0" max="63" data-l="${li}" data-f="led" value="${l.led}"> ${esc(t.label)} <input class="lab" data-l="${li}" data-f="label" value="${esc(l.label)}">
 <button data-ident="${li}">${esc(t.ident)}</button><span class="sp"></span><button class="del" data-delled="${li}">${esc(t.delLed)}</button></div>
 <table><tr><th></th><th>${esc(t.conds)}</th><th>${esc(t.mode)}</th><th>${esc(t.color)}</th><th>${esc(t.on)}</th><th></th></tr>`;
 l.rules.forEach((r,ri)=>{h+=`<tr class="${ri===a?"act":""} ${r.disabled?"dis":""}"><td><button data-up="${li},${ri}">↑</button></td><td>`;
  (r.conds||[]).forEach((c,ci)=>{h+=`<div class="cond"><input class="arg" list="args" data-c="${li},${ri},${ci}" data-f="arg" value="${esc(c.arg)}">
  <select data-c="${li},${ri},${ci}" data-f="op">${["==","!=",">","<",">=","<="].map(o=>`<option ${o===c.op?"selected":""}>${o}</option>`).join("")}</select>
  <input class="val" data-c="${li},${ri},${ci}" data-f="value" value="${esc(c.value)}"> <span class="cur">${esc(t.now+cur(c.arg))}</span> <button data-delcond="${li},${ri},${ci}">×</button></div>`});
  if(!(r.conds||[]).length)h+=`<span class="always">${esc(t.always)}</span> `;
  h+=`<button data-addcond="${li},${ri}">${esc(t.addCond)}</button></td><td><select data-r="${li},${ri}" data-f="mode">${Object.keys(t.modes).map(m=>`<option value="${m}" ${m===r.mode?"selected":""}>${esc(t.modes[m])}</option>`).join("")}</select></td>
  <td><input type="color" data-r="${li},${ri}" data-f="color" value="${esc(r.color||"#ffffff")}"></td><td><input type="checkbox" data-r="${li},${ri}" data-f="enabled" ${r.disabled?"":"checked"}></td>
  <td><button class="del" data-delrule="${li},${ri}">×</button></td></tr>`});
 h+=`</table><button data-addrule="${li}">${esc(t.addRule)}</button></section>`});
 h+=`<div><button id="addled">${esc(t.addLed)}</button></div><datalist id="devlist">${DEVS.map(d=>`<option value="${esc(d)}">`).join("")}</datalist>`;
 const foc=document.activeElement,fk=foc&&foc.dataset?JSON.stringify(foc.dataset):null,sel=foc&&foc.selectionStart;
 $("main").innerHTML=h;if(fk){const el=[...document.querySelectorAll("#main input,#main select")].find(e=>JSON.stringify(e.dataset)===fk);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
 $("args").innerHTML=Object.keys(VALS).sort().map(k=>`<option value="${esc(k)}">`).join("");
 $("sw").onchange=async e=>{await fetch("/vkb?on="+(e.target.checked?1:0),{method:"POST",headers:{"X-SCTL":"1"}});ON=e.target.checked}}
const P=s=>s.split(",").map(Number);
$("main").addEventListener("input",e=>{const d=e.target.dataset;if(d.l){const l=LEDS[+d.l];l[d.f]=d.f==="led"?Math.max(0,Math.min(63,parseInt(e.target.value)||0)):e.target.value}
 else if(d.c){const[a,b,c]=P(d.c);LEDS[a].rules[b].conds[c][d.f]=e.target.value}
 else if(d.r){const[a,b]=P(d.r),r=LEDS[a].rules[b];if(d.f==="enabled")r.disabled=!e.target.checked;else r[d.f]=e.target.value}else return;setDirty(true);if(e.target.tagName!=="INPUT"||e.target.type!=="text")render()});
$("main").addEventListener("change",e=>{if(e.target.dataset.c||e.target.dataset.l)render()});
$("main").addEventListener("click",async e=>{const d=e.target.dataset;let ch=true;
 if(d.up){const[a,b]=P(d.up);if(b>0){const r=LEDS[a].rules;[r[b-1],r[b]]=[r[b],r[b-1]]}}
 else if(d.addcond){const[a,b]=P(d.addcond);(LEDS[a].rules[b].conds=LEDS[a].rules[b].conds||[]).push({arg:"",op:"==",value:"1"})}
 else if(d.delcond){const[a,b,c]=P(d.delcond);LEDS[a].rules[b].conds.splice(c,1)}
 else if(d.delrule){const[a,b]=P(d.delrule);LEDS[a].rules.splice(b,1)}
 else if(d.addrule!==undefined){LEDS[+d.addrule].rules.push({conds:[{arg:"seated",op:"==",value:"1"}],mode:"on",color:"#00ff00"})}
 else if(d.delled!==undefined){LEDS.splice(+d.delled,1)}
 else if(e.target.id==="addled"){LEDS.push({device:DEVS[0]?DEVS[0].split(" ").slice(0,2).join(" "):"",led:0,label:"",rules:[]})}
 else if(d.ident!==undefined){ch=false;if(!ON){alert(T[L].identOff);return}const l=LEDS[+d.ident];await fetch(`/vkb/identify?device=${encodeURIComponent(l.device)}&led=${l.led}`,{method:"POST",headers:{"X-SCTL":"1"}});return}
 else return;if(ch){setDirty(true);render()}});
$("save").onclick=async()=>{const r=await fetch("/vkb/rules",{method:"POST",headers:{"X-SCTL":"1","Content-Type":"application/json"},body:JSON.stringify(LEDS)});if(r.ok){setDirty(false);$("msg").textContent=T[L].saved;load(true)}else $("msg").textContent=await r.text()};
$("reset").onclick=async()=>{if(!confirm(T[L].confirmReset))return;await fetch("/vkb/rules?reset=1",{method:"POST",headers:{"X-SCTL":"1"}});setDirty(false);load(true)};
$("lang").onclick=()=>{L=L==="fr"?"en":"fr";try{localStorage.setItem("sctl-lang",L)}catch(e){}render()};
async function load(full){try{const j=await (await fetch("/vkb/rules")).json(),v=await (await fetch("/vkb")).json();VALS=j.values||{};NAMES=j.names||{};DEVS=j.devices||[];ON=v.on;if(full||!LEDS)LEDS=j.leds||[];
 const foc=document.activeElement;if(!(foc&&(foc.tagName==="SELECT"||foc.tagName==="INPUT")&&foc.closest("#main")))render()}catch(e){}}
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=""}};
load(true);setInterval(()=>load(false),1000);render();
</script></body></html>
